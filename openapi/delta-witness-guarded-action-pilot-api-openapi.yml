openapi: 3.2.0
info:
  title: DELTA Witness — Trust Layer for Autonomous Actions Guarded…
  version: 0.7.0
  description: Browser verification and page-state proof for public sources, plus deterministic preflight checks before an autonomous action. DELTA proves observation and change, not truth.
  contact:
    name: DELTA Witness
    email: ruphussten@163.com
    url: https://delta-witness-api.ruphussten.workers.dev/docs
  x-guidance: Call GET /v1/quote before budgeting. Capture preserves a public observation; Guard compares one with deterministic expectations; Guarded-Action Pilot bundles 1-3 public URL proofs for exactly $10. Runtime HTTP 402 payment requirements are authoritative.
servers:
- url: https://delta-witness-api.ruphussten.workers.dev
tags:
- name: guarded-action-pilot
paths:
  /v1/guarded-action-pilot:
    post:
      operationId: guardedActionPilot
      summary: Buy one guarded-action evidence pilot for exactly $10
      description: Capture 1-3 public HTTPS pages as timestamped DELTA proofs and optionally run one deterministic preflight check. One x402 v2 upfront payment of exactly $10 USDC on Base covers the package.
      tags:
      - guarded-action-pilot
      security: []
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '10'
        protocols:
        - x402: {}
        network: eip155:8453
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                urls:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: string
                    pattern: ^https://
                    description: Public HTTPS webpage to witness.
                preflight:
                  type: object
                  additionalProperties: false
                  properties:
                    url_index:
                      type: integer
                      minimum: 0
                      maximum: 2
                    expected:
                      type: object
                      additionalProperties: false
                      properties:
                        html_sha256:
                          type: string
                          pattern: ^sha256:[0-9a-f]{64}$
                        markdown_sha256:
                          type: string
                          pattern: ^sha256:[0-9a-f]{64}$
                        contains:
                          type: array
                          maxItems: 10
                          items:
                            type: string
                            maxLength: 200
                        excludes:
                          type: array
                          maxItems: 10
                          items:
                            type: string
                            maxLength: 200
                  required:
                  - url_index
                  - expected
              required:
              - urls
      responses:
        '200':
          description: Guarded-action evidence package delivered
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - product
                - price_usd
                - proofs
                - economics
                properties:
                  ok:
                    const: true
                  product:
                    const: guarded_action_pilot
                  price_usd:
                    const: 10
                  proofs:
                    type: array
                    minItems: 1
                    maxItems: 3
                    items:
                      type: object
                      required:
                      - url
                      - proof_id
                      - manifest_url
                      - public_proof_url
                      - bundle_root
                      - observed_at
                      - allocated_price_usd
                      properties:
                        url:
                          type: string
                        proof_id:
                          type: string
                        manifest_url:
                          type: string
                        public_proof_url:
                          type: string
                        bundle_root:
                          type: string
                        observed_at:
                          type: string
                        allocated_price_usd:
                          type: number
                  preflight:
                    type: object
                  economics:
                    type: object
                  idempotent_replay:
                    type: boolean
        '202':
          description: Identical settled fulfillment already in progress
        '400':
          description: Request rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '402':
          description: Exact $10 x402 v2 payment required
        '409':
          description: Payment replay attempted with a different request
        '413':
          description: Request rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '502':
          description: Settled pilot failed; identical retry remains idempotent
