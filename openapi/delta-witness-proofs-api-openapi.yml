- name: Proofs
paths:
  /v1/proofs/{proof_id}:
    get:
      operationId: verifyProof
      summary: Read public proof metadata and hashes (raw artifacts remain private)
      security: []
      parameters:
      - name: proof_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Verifier metadata
        '404':
          description: Not found
      tags:
      - Proofs
