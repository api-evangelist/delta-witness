    note: >-
      Not a classic securityScheme. The paid operations declare security: [] in
      OpenAPI and enforce payment at runtime via the x402 402 flow.
  - id: PartnerProxySecret
    type: apiKey
    in: header
    name: x-delta-partner-secret
