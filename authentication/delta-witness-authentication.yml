summary: >-
  The public DELTA Witness API declares no traditional authentication. Access to
  billable operations is gated by machine payment (x402 v2) rather than by an API
  key or OAuth token. Free operations (/health, /v1/quote, /v1/demo,
  /v1/proofs/{id}) are open. The separate partner gateway uses an apiKey secret.
