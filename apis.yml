name: DELTA Witness — Trust Layer for Autonomous Actions
description: >-
  Machine-verifiable capture and preflight verification of public web sources. Returns timestamped content hashes plus a
  public verifier, keeping raw capture artifacts private. Access is payment-gated via the x402 v2 protocol using USDC on
  Base mainnet. Proves observation and change, not truth.
